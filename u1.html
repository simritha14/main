<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital Statistics</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 2em;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 40px;
      text-align: center;
    }

    .image-upload {
      margin-bottom: 30px;
    }

    .image-upload input[type="file"] {
      display: none;
    }

    .image-upload label {
      background-color: #f1c27d;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }

    .image-upload label:hover {
      background-color: #e0b76c;
    }

    #preview {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 12px;
    }

    .score-section {
      margin-top: 30px;
      font-size: 1.5em;
      font-weight: bold;
      color: #4CAF50;
    }
  </style>
</head>
<body>

  <header>Vital Statistics</header>

  <div class="container">
<div class="image-upload">
  <label for="file-input">Upload Test Papers</label>
  <input type="file" id="file-input" accept="image/*" multiple>
  <div id="preview-container"></div>
</div>

<div class="score-section">
  Score: <span id="score">-- / 100</span>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const previewContainer = document.getElementById('preview-container');

  fileInput.addEventListener('change', () => {
    previewContainer.innerHTML = ''; // Clear previous previews

    const files = Array.from(fileInput.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = document.createElement('img');
        img.src = reader.result;
        img.style.maxWidth = '100%';
        img.style.marginTop = '20px';
        img.style.borderRadius = '12px';
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  // Dummy score
  document.getElementById('score').textContent = '85 / 100';
</script>

</body>
</html>
