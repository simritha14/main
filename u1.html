<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

  <title>Vital Statistics</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 2em;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 40px;
      text-align: center;
    }

    .image-upload {
      margin-bottom: 30px;
    }

    .image-upload input[type="file"] {
      display: none;
    }

    .image-upload label {
      background-color: #f1c27d;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
      display: inline-block;
      margin-top: 20px;
    }

    .image-upload label:hover {
      background-color: #e0b76c;
    }

    #preview-container img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }

    .score-section {
      margin-top: 30px;
      font-size: 1.5em;
      font-weight: bold;
      color: #4CAF50;
    }
  </style>
</head>
<body>

  <header>Vital Statistics</header>

  <div class="container">
    <div class="image-upload">
      <div id="preview-container"></div>
      <label for="file-input" id="upload-label">Upload Test Papers</label>
      <input type="file" id="file-input" accept="image/*" multiple>
    </div>

    <div class="score-section">
      Score: <span id="score">-- / 100</span>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const uploadLabel = document.getElementById('upload-label');

    // Load saved images on page load
    window.addEventListener('DOMContentLoaded', () => {
      const savedImages = JSON.parse(localStorage.getItem('uploadedImages') || '[]');
      savedImages.forEach(dataURL => {
        displayImage(dataURL);
      });

      if (savedImages.length > 0) {
        moveUploadButton();
      }
    });

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files);
      const savedImages = JSON.parse(localStorage.getItem('uploadedImages') || '[]');

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataURL = reader.result;
          displayImage(dataURL);

          // Save to localStorage
          savedImages.push(dataURL);
          localStorage.setItem('uploadedImages', JSON.stringify(savedImages));

          moveUploadButton();
        };
        reader.readAsDataURL(file);
      });

      fileInput.value = ''; // Clear input
    });

    function displayImage(src) {
      const img = document.createElement('img');
      img.src = src;
      previewContainer.appendChild(img);
    }

    function moveUploadButton() {
      previewContainer.insertAdjacentElement('afterend', uploadLabel);
    }

    // Dummy score
    document.getElementById('score').textContent = '85 / 100';
  </script>

</body>
</html>
